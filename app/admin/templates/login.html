{% extends "base.html" %}
{% block title %}Вхід{% endblock %}
{% block content %}
<div class="card" style="max-width:380px;margin:40px auto">
  <h1>Вхід в адмінку</h1>
  {% if error %}<div class="flash err">{{ error }}</div>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{ next }}">
    <p><label>Логін</label><input name="login" autocomplete="username" required autofocus></p>
    <p><label>Пароль</label><input name="password" type="password" autocomplete="current-password" required></p>
    <button type="submit">Увійти</button>
  </form>
</div>
{% endblock %}
